[project]
name = "esdl-validator"
version = "0.0.9"
description = "ESDL Validator"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "autodiscover>=0.0.4",
    "environ-config==20.1.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "flask-restx>=1.3.0",
    "pyesdl>=26.6",
    "pymongo<=4.13",
    "tinydb>=4.8.2",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.4.1",
]

[tool.black]
line-length = 120
exclude = '''
/(
   \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.env
  | \.venv
  | _build
  | build
  | dist
)/
'''
