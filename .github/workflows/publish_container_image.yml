#name: Deply to GitHub Container Registry
run-name: Releasing next version 🚀
on:
  push:
    tags:
      - '*'

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_CONTAINER_PUSH_USERNAME }}
          password: ${{ secrets.DOCKERHUB_CONTAINER_PUSH }}

      - name: Build the container image
        run: |
          TAG="${{ github.ref_name }}"
          docker build . --tag esdlmapeditoressim/esdlvalidator:$TAG
          docker push esdlmapeditoressim/esdlvalidator:$TAG

          # Only stable releases (e.g. 1.2.3) update :latest; pre-release tags (e.g. 1.2.3-rc.1) do not.
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag esdlmapeditoressim/esdlvalidator:$TAG esdlmapeditoressim/esdlvalidator:latest
            docker push esdlmapeditoressim/esdlvalidator:latest
          else
            echo "Skipping :latest update for pre-release tag '$TAG'"
          fi
