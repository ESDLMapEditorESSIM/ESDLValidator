#name: Deply to GitHub Container Registry
run-name: Releasing next version 🚀
on:
  push:
    tags:
      - '*'

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the container image
      run: |
        docker build . --tag esdlmapeditoressim/esdl_validator:latest --tag esdlmapeditoressim/esdl_validator:${{ github.ref_name}}
        docker push esdlmapeditoressim/esdl_validator:latest
        docker push esdlmapeditoressim/esdl_validator:${{ github.ref_name}}
