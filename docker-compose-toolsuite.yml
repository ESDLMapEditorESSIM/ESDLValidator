networks:
  mapeditor-net:
    driver: bridge
    name: mapeditor-net
    external: true

services:
  esdl-validator:
#    build: ./
    image: esdlmapeditoressim/esdlvalidator:0.0.17
    ports:
      - "5000:5000"
    environment:
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
    volumes:
      - validator-storage:/storage
    networks:
      - mapeditor-net

volumes:
  validator-storage: